# Tests, then deploys the jury to Cloudflare on every push to main (or by hand). Repository secrets:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, INGEST_TOKEN, and optionally LANGSMITH_API_KEY, KEYSTONE_BOT_TOKEN, OWNER_TOKEN.
name: Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ai_per_day:
        description: "Paid model calls per day (AI_PER_DAY). Raise it for a demo day; the next push to main sets it back to wrangler.jsonc"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: bash scripts/setup-cloudflare.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          KEYSTONE_BOT_TOKEN: ${{ secrets.KEYSTONE_BOT_TOKEN }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          AI_PER_DAY: ${{ inputs.ai_per_day }}
